name: Build immortalwrt x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "输入luci版本 格式:25.12.1 或 latest"
        required: true
        default: "latest"
      lan_ip_address:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '请输入要编译固件大小 单位(MB)'
        required: true
        default: '1024'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_username:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 qemu-utils genisoimage zstd jq

      - name: Get Luci Version
        run: |
          if [ "${{ github.event.inputs.luci_version }}" = "latest" ]; then
            if sudo curl --retry 3 --retry-delay 5 --fail -X 'GET' -H 'Accept: application/json' https://sysupgrade.kyarucloud.moe/json/v1/latest.json -o latest.json; then
              luci_version=$(jq -r '.latest[0]' latest.json)
              sudo rm latest.json
            else
              echo "Failed to get latest luci version"
              exit 1
            fi
          else
            luci_version="${{ github.event.inputs.luci_version }}"
          fi
          echo "luci_version=$luci_version"
          echo "luci_version=$luci_version" >> $GITHUB_ENV



      - name: Download and extract Image Builder
        run: |
          file_name="immortalwrt-imagebuilder-$luci_version-x86-64.Linux-x86_64"
          echo "download target is $file_name"
          wget -O /tmp/imagebuilder.tar.zst "https://downloads.immortalwrt.org/releases/$luci_version/targets/x86/64/$file_name.tar.zst"
          sudo tar -I zstd -C /tmp -xvf /tmp/imagebuilder.tar.zst
          ROOT_DIRECTORY="/tmp/$file_name"
          echo "ROOT_DIRECTORY=$ROOT_DIRECTORY" >> $GITHUB_ENV

      - name: Modify .config file
        run: |
          CONFIG_FILE="$ROOT_DIRECTORY/.config"
          # Disable iso and virtual disk image generation for x86
          sudo sed -i 's/^CONFIG_ISO_IMAGES=y/# CONFIG_ISO_IMAGES is not set/' $CONFIG_FILE
          sudo sed -i 's/^CONFIG_QCOW2_IMAGES=y/# CONFIG_QCOW2_IMAGES is not set/' $CONFIG_FILE
          sudo sed -i 's/^CONFIG_VDI_IMAGES=y/# CONFIG_VDI_IMAGES is not set/' $CONFIG_FILE
          sudo sed -i 's/^CONFIG_VMDK_IMAGES=y/# CONFIG_VMDK_IMAGES is not set/' $CONFIG_FILE
          sudo sed -i 's/^CONFIG_VHDX_IMAGES=y/# CONFIG_VHDX_IMAGES is not set/' $CONFIG_FILE
          
          profile="${{ github.event.inputs.profile }}"
          sudo sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=$profile/" $CONFIG_FILE

      - name: Copy files
        run: |
          # Creator folders
          sudo mkdir -p $ROOT_DIRECTORY/files/etc/uci-defaults
          # Copy custom setting file
          uci_defaults_sh=$ROOT_DIRECTORY/files/etc/uci-defaults/99-custom
          echo "uci_defaults_sh=$uci_defaults_sh" >> $GITHUB_ENV
          sudo cp ${{ github.workspace }}/configs/uci-defaults.sh $uci_defaults_sh

      - name: Modify lan ip address
        run: |
          lan_ip_address="${{ github.event.inputs.lan_ip_address }}"
          sudo sed -i "s/^# lan_ip_address=.*/lan_ip_address=$lan_ip_address/" $uci_defaults_sh

      - name: Modify pppoe settings
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_username }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE username and password must be provided when PPPoE is enabled!"
              exit 1              
            fi
            pppoe_username=${{ inputs.pppoe_username }}
            pppoe_password=${{ inputs.pppoe_password }}
            sudo sed -i "s/^# pppoe_username=.*/pppoe_username=$pppoe_username/" $uci_defaults_sh
            sudo sed -i "s/^# pppoe_password=.*/pppoe_password=$pppoe_password/" $uci_defaults_sh
          fi

      - name: Compile firmware
        run: |
          packages=$(cat ${{ github.workspace }}/configs/packages.list | tr '\n' ' ')
          echo "Building for profile: $profile"

          cd $ROOT_DIRECTORY
          sudo make image PROFILE="generic" PACKAGES="$packages" FILES="./files"
          if [ $? -ne 0 ]; then
              echo "$(date '+%Y-%m-%d %H:%M:%S') - Error: Build failed!"
              exit 1
          fi

          echo "$(date '+%Y-%m-%d %H:%M:%S') - Build completed successfully."

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          
          - 🏠 **后台地址**: ${{ github.event.inputs.lan_ip_address }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-x86-64-${{ env.luci_version }}
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ env.ROOT_DIRECTORY }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 2